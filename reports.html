<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#185fa5">
<title>A股和港股监控报告 · 报告页</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1f2328; --muted: #656d76;
    --border: #d8dee4; --accent: #185fa5; --accent-soft: #e6f1fb;
    --am-bg: #eaf3de; --am-tx: #3b6d11; --pm-bg: #e6f1fb; --pm-tx: #185fa5;
    --ok: #1d7a3d; --warn: #993c1d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 15px; line-height: 1.7; }
  header { background: var(--card); border-bottom: 1px solid var(--border);
    padding: 10px 16px 0; position: sticky; top: 0; z-index: 10; }
  header .row { max-width: 880px; margin: 0 auto; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; margin-top: 8px; }
  .tab { flex: 1; border: none; background: none; font: inherit; font-size: 14px; padding: 9px 4px;
    color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .navlink { color: var(--accent); font-size: 13px; text-decoration: none; margin-left: auto; margin-right: 10px; white-space: nowrap; }
  .wrap { max-width: 880px; margin: 14px auto 30px; padding: 0 12px; }
  /* ── 报告：日期分组选择器 ── */
  .picker { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .dgroup + .dgroup { border-top: 1px solid var(--border); }
  .drow { width: 100%; display: flex; align-items: center; gap: 8px; padding: 13px 16px;
    background: none; border: none; font: inherit; cursor: pointer; text-align: left; }
  .drow:active { background: var(--bg); }
  .drow .arrow { color: var(--muted); font-size: 12px; transition: transform .25s ease; }
  .dgroup.open .drow .arrow { transform: rotate(90deg); }
  .drow .date { font-weight: 600; font-size: 15px; }
  .drow .cnt { color: var(--muted); font-size: 12px; margin-left: auto; }
  .chips { display: grid; grid-template-rows: 0fr; padding: 0 12px;
    transition: grid-template-rows .28s ease, padding .28s ease; }
  .chips-inner { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
  .dgroup.open .chips { grid-template-rows: 1fr; padding-top: 2px; padding-bottom: 12px; }
  /* ── 日期筛选栏 ── */
  .filterbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .datebtn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border);
    background: var(--card); border-radius: 10px; padding: 9px 13px; font: inherit; font-size: 14px;
    color: var(--text); cursor: pointer; transition: border-color .15s ease; }
  .datebtn:hover, .datebtn.open { border-color: var(--accent); }
  .datebtn .caret { color: var(--muted); font-size: 11px; transition: transform .2s ease; }
  .datebtn.open .caret { transform: rotate(180deg); }
  .clearbtn { border: 1px solid var(--border); background: var(--card); color: var(--muted);
    border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 13px; cursor: pointer;
    transition: color .15s ease, border-color .15s ease; }
  .clearbtn:hover { color: var(--text); border-color: var(--accent); }
  .filterinfo { font-size: 12px; color: var(--muted); margin-left: auto; }
  /* ── 日历弹层 ── */
  .calwrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; margin-bottom: 12px; animation: calin .18s ease; }
  @keyframes calin { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .calhead button { border: none; background: none; font: inherit; font-size: 18px; color: var(--muted);
    cursor: pointer; padding: 2px 12px; border-radius: 8px; transition: background .12s ease, color .12s ease; }
  .calhead button:hover { background: var(--bg); color: var(--text); }
  .calmonth { font-weight: 600; font-size: 14px; }
  .calweek { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
    font-size: 11px; color: var(--muted); padding-bottom: 4px; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cday { position: relative; aspect-ratio: 1; border: none; background: var(--bg); border-radius: 8px;
    font: inherit; font-size: 13px; color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background .12s ease; }
  .cday:hover { background: var(--accent-soft); }
  .cday.zero { opacity: .32; cursor: default; }
  .cday.zero:hover { background: var(--bg); }
  .cday.today { box-shadow: inset 0 0 0 1px var(--accent); }
  .cday.sel { background: var(--accent); color: #fff; font-weight: 600; }
  .cday .badge { position: absolute; top: 3px; right: 4px; font-size: 10px; line-height: 1;
    color: var(--accent); font-weight: 600; }
  .cday.sel .badge { color: #fff; }
  .calfoot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 8px; }
  .calhint { font-size: 11px; color: var(--muted); }
  .calfoot-btn { border: none; background: none; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
  /* ── 精简报告列表 ── */
  .picker { margin-bottom: 12px; }
  .rrow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; font: inherit; cursor: pointer;
    transition: border-color .15s ease, background .15s ease; }
  .rrow:hover { border-color: var(--accent); }
  .rrow.active { background: var(--accent-soft); border-color: var(--accent); }
  .rrow .rdate { flex: 0 0 44px; font-size: 13px; font-weight: 600; color: var(--text); }
  .rrow .rtag { flex: 0 0 auto; }
  .rrow .rt { flex: 1; min-width: 0; font-size: 13.5px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rrow.active .rt { color: var(--text); }
  .rrow .rarch { flex: 0 0 auto; font-size: 11px; color: var(--warn); }
  .tab { transition: color .15s ease, border-color .15s ease; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .tag { flex-shrink: 0; font-size: 12px; padding: 2px 9px; border-radius: 10px; }
  .tag.am { background: var(--am-bg); color: var(--am-tx); }
  .tag.pm { background: var(--pm-bg); color: var(--pm-tx); }
  /* ── 正文 ── */
  main { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 16px; }
  @media (min-width: 600px) { main { padding: 28px 32px; } header h1 { font-size: 19px; } }
  .empty { color: var(--muted); text-align: center; padding: 50px 16px; }
  .md h1 { font-size: 19px; margin: 2px 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .md h2 { font-size: 17px; margin: 22px 0 10px; }
  .md h3 { font-size: 15px; margin: 18px 0 8px; }
  .md p, .md li { font-size: 15px; }
  .md table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13px; display: block; overflow-x: auto; white-space: nowrap; }
  .md th, .md td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
  .md th { background: var(--bg); }
  .md blockquote { border-left: 3px solid var(--accent); background: var(--accent-soft);
    padding: 10px 14px; margin: 12px 0; border-radius: 0 8px 8px 0; }
  .md code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
  .via-tip { font-size: 12px; color: var(--muted); margin-top: 16px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 16px 30px; }
  .err-link { color: var(--accent); }
  /* ── 持仓编辑 ── */
  .note { font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .sec-title { font-size: 15px; font-weight: 600; margin: 16px 0 8px; }
  .stock-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .stock-card .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .stock-card .name { font-weight: 600; font-size: 15px; }
  .del { border: none; background: none; color: var(--warn); font-size: 13px; cursor: pointer; padding: 2px 4px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fields label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; }
  .fields input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    font: inherit; font-size: 14px; background: var(--bg); }
  .fields input:focus { outline: none; border-color: var(--accent); }
  .full { grid-column: 1 / -1; }
  .addbtn, .savebtn { width: 100%; border: 1px dashed var(--border); background: var(--card);
    border-radius: 10px; padding: 11px; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; margin-bottom: 14px; }
  .savebtn { border-style: solid; background: var(--accent); color: #fff; font-weight: 600; border-color: var(--accent); }
  .savebtn:active { opacity: .85; }
  .status { text-align: center; font-size: 13px; margin-top: 10px; min-height: 20px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--warn); }
  .token-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .token-box h3 { font-size: 15px; margin-bottom: 8px; }
  .token-box ol { font-size: 13px; color: var(--muted); padding-left: 18px; margin: 8px 0 12px; }
  .token-box a { color: var(--accent); }
  .token-box input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px;
    font: inherit; font-size: 13px; background: var(--bg); margin-bottom: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>A股和港股监控报告</h1>
    <a class="navlink" href="index.html">← 新闻首页</a>
    <div class="sub" id="updated"></div>
  </div>
  <div class="tabs">
    <button class="tab active" id="tabbtn-report" onclick="switchTab('report')">报告</button>
    <button class="tab" id="tabbtn-holdings" onclick="switchTab('holdings')">持仓编辑</button>
  </div>
</header>
<div class="wrap">
  <div id="tab-report">
    <div class="filterbar">
      <button class="datebtn" id="dateBtn" onclick="toggleCalendar()" aria-haspopup="dialog">
        <span>📅</span><span id="dateBtnLabel">最新报告</span><span class="caret">▾</span>
      </button>
      <button class="clearbtn hidden" id="clearBtn" onclick="clearFilter()">✕ 清除筛选</button>
      <span class="filterinfo" id="filterInfo"></span>
    </div>
    <div class="calwrap hidden" id="calWrap" role="dialog" aria-label="选择报告日期">
      <div class="calhead">
        <button onclick="monthMove(-1)" aria-label="上个月">‹</button>
        <span class="calmonth" id="calMonth"></span>
        <button onclick="monthMove(1)" aria-label="下个月">›</button>
      </div>
      <div class="calweek"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="calgrid" id="calGrid"></div>
      <div class="calfoot">
        <span class="calhint">角标数字＝当日报告数 · 灰色＝无报告</span>
        <button class="calfoot-btn" onclick="jumpToLatest()">回到最新</button>
      </div>
    </div>
    <section class="picker" id="picker"></section>
    <main id="main"><div class="empty">正在载入最新报告…</div></main>
  </div>
  <div id="tab-holdings" class="hidden">
    <div id="holdings-body"><div class="empty">加载中…</div></div>
  </div>
</div>
<footer>
  所有信号均由 AI 基于公开信息生成，仅供研究参考，不构成投资建议；入场前需在券商实时行情中再次确认。本站不自动执行交易。
</footer>
<script>
/* ═══ 通用：多源取数 ═══ */
const GH_BASE = 'https://ericheee111.github.io/stock-monitor-reports/';
const MIRROR = 'https://cdn.jsdelivr.net/gh/ericheee111/stock-monitor-reports@main/';
const SOURCES = ['', MIRROR];
const delay = ms => new Promise(r => setTimeout(r, ms));
async function fetchText(path) {
  let lastErr = null;
  for (let s = 0; s < SOURCES.length; s++) {
    for (let t = 0; t < 2; t++) {
      try {
        const url = (SOURCES[s] || GH_BASE) + path + '?t=' + Date.now();
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return { text: await res.text(), via: s };
      } catch (e) { lastErr = e; await delay(500); }
    }
  }
  throw lastErr || new Error('all sources failed');
}
function switchTab(name) {
  document.getElementById('tab-report').classList.toggle('hidden', name !== 'report');
  document.getElementById('tab-holdings').classList.toggle('hidden', name !== 'holdings');
  document.getElementById('tabbtn-report').classList.toggle('active', name === 'report');
  document.getElementById('tabbtn-holdings').classList.toggle('active', name === 'holdings');
  if (name === 'holdings') initHoldings();
}

/* ═══ 报告 ═══ */
let REPORTS = [];
let CURRENT = null;
let SELECTED_DATE = null;   /* null = 未筛选（默认展示最新日期） */
let DATE_COUNTS = {};       /* {'2026-09-15': 2} ← 日历角标数据源 */
let CAL_MONTH = null;

const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function load() {
  fetchText('reports/index.json')
    .then(({ text }) => {
      const d = JSON.parse(text);
      REPORTS = d.reports || [];
      document.getElementById('updated').textContent = d.generatedAt ? ('更新于 ' + d.generatedAt) : '';
      buildDateCounts();
      renderPicker();
    })
    .catch(() => {
      document.getElementById('picker').innerHTML = '<div class="empty" style="padding:14px">索引加载失败，请稍后下拉刷新重试</div>';
      document.getElementById('main').innerHTML = '<div class="empty">网络波动，刷新页面可重试</div>';
    });
}
function buildDateCounts() {
  DATE_COUNTS = {};
  REPORTS.forEach(r => { DATE_COUNTS[r.date] = (DATE_COUNTS[r.date] || 0) + 1; });
}
function sortedReports() {
  return REPORTS.slice().sort((a, b) =>
    b.date.localeCompare(a.date) || (a.session === 'pm' ? -1 : 1) - (b.session === 'pm' ? -1 : 1));
}
function latestDate() {
  const ds = Object.keys(DATE_COUNTS).sort();
  return ds.length ? ds[ds.length - 1] : null;
}
function activeDate() { return SELECTED_DATE || latestDate(); }
function dateItems(date) { return sortedReports().filter(r => r.date === date); }

function renderPicker() {
  const picker = document.getElementById('picker');
  if (!REPORTS.length) {
    picker.innerHTML = '<div class="empty" style="padding:14px">暂无报告，监控任务运行后会自动发布</div>';
    return;
  }
  const date = activeDate();
  const items = dateItems(date);
  const md = date.slice(5);
  picker.innerHTML = items.map((r, i) =>
    '<button class="rrow" id="rrow-' + i + '" onclick="selectByIdx(' + i + ')">' +
      '<span class="rdate">' + md + '</span>' +
      '<span class="tag ' + (r.session === 'am' ? 'am">上午' : 'pm">下午') + '</span>' +
      '<span class="rt">' + esc(r.title || '') + '</span>' +
      (r.archived ? '<span class="rarch">存档</span>' : '') +
    '</button>').join('');
  CURRENT = null;
  const first = document.getElementById('rrow-0');
  if (first) first.classList.add('active');
  show(items[0], { scrollInto: true });
  updateFilterUI(date, items.length);
}
function selectByIdx(i) {
  const items = dateItems(activeDate());
  document.querySelectorAll('.rrow').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('rrow-' + i);
  if (el) el.classList.add('active');
  show(items[i], { scrollInto: true });
}
function updateFilterUI(date, count) {
  document.getElementById('dateBtnLabel').textContent =
    SELECTED_DATE ? (SELECTED_DATE.slice(5) + ' 的报告') : '最新报告';
  document.getElementById('clearBtn').classList.toggle('hidden', !SELECTED_DATE);
  document.getElementById('filterInfo').textContent = date + ' · ' + count + ' 篇';
}

/* ── 日历 ── */
function toggleCalendar() {
  const wrap = document.getElementById('calWrap');
  const btn = document.getElementById('dateBtn');
  const willOpen = wrap.classList.contains('hidden');
  wrap.classList.toggle('hidden', !willOpen);
  btn.classList.toggle('open', willOpen);
  if (willOpen) {
    CAL_MONTH = activeDate().slice(0, 7);
    renderCalendar();
  }
}
function monthMove(delta) {
  const parts = CAL_MONTH.split('-').map(Number);
  const d = new Date(parts[0], parts[1] - 1 + delta, 1);
  CAL_MONTH = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  renderCalendar();
}
function renderCalendar() {
  const parts = CAL_MONTH.split('-').map(Number);
  const y = parts[0], m = parts[1];
  document.getElementById('calMonth').textContent = y + ' 年 ' + m + ' 月';
  const firstDow = new Date(y, m - 1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const now = new Date();
  const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') +
    '-' + String(now.getDate()).padStart(2, '0');
  let html = '';
  for (let i = 0; i < firstDow; i++) html += '<span></span>';
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const c = DATE_COUNTS[ds] || 0;
    const cls = ['cday'];
    if (c === 0) cls.push('zero');
    if (ds === todayStr) cls.push('today');
    if (ds === SELECTED_DATE) cls.push('sel');
    html += '<button class="' + cls.join(' ') + '"' +
      (c ? ' onclick="pickDate(\'' + ds + '\')"' : ' aria-disabled="true"') +
      ' aria-label="' + ds + (c ? '，' + c + ' 篇报告' : '，无报告') + '">' + d +
      (c ? '<span class="badge">' + c + '</span>' : '') + '</button>';
  }
  document.getElementById('calGrid').innerHTML = html;
}
function pickDate(ds) {
  if (!DATE_COUNTS[ds]) return;
  SELECTED_DATE = ds;
  closeCalendar();
  renderPicker();
}
function clearFilter() {
  SELECTED_DATE = null;
  renderPicker();
}
function jumpToLatest() {
  SELECTED_DATE = null;
  closeCalendar();
  renderPicker();
}
function closeCalendar() {
  document.getElementById('calWrap').classList.add('hidden');
  document.getElementById('dateBtn').classList.remove('open');
}
async function show(r, opts) {
  CURRENT = r;
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const { text, via } = await fetchText(r.file);
    if (CURRENT !== r) return;
    main.innerHTML = '<div class="md">' + marked.parse(text) + '</div>';
    if (via > 0) {
      const tip = document.createElement('div');
      tip.className = 'via-tip';
      tip.textContent = '（主源暂时不可达，本报告经备用镜像提供，内容可能滞后最多 12 小时）';
      main.appendChild(tip);
    }
    if (opts && opts.scrollInto && main.getBoundingClientRect().top < 0) {
      main.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  } catch (e) {
    if (CURRENT !== r) return;
    main.innerHTML = '<div class="empty">报告加载失败（网络波动），可稍后下拉刷新<br><br>' +
      '<a class="err-link" href="' + GH_BASE + r.file + '" target="_blank">打开报告原文（GitHub）</a><br>' +
      '<a class="err-link" href="' + MIRROR + r.file + '" target="_blank">打开报告原文（备用镜像）</a></div>';
  }
}
load();

/* ═══ 持仓编辑 ═══ */
const DATA_OWNER = 'ericheee111', DATA_REPO = 'stock-monitor-data';
const API = 'https://api.github.com/repos/' + DATA_OWNER + '/' + DATA_REPO + '/contents/';
const TOKEN_KEY = 'gh_data_token';
let FILE_SHA = null, PARSED = null;

const b64d = s => { const bin = atob(s.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); };
const b64e = s => { const bytes = new TextEncoder().encode(s); let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
const getToken = () => localStorage.getItem(TOKEN_KEY) || '';
const ghHeaders = () => ({ 'Authorization': 'Bearer ' + getToken(), 'Accept': 'application/vnd.github+json' });

async function initHoldings() {
  const body = document.getElementById('holdings-body');
  if (!getToken()) { body.innerHTML = tokenSetupHTML(); return; }
  body.innerHTML = '<div class="empty">加载持仓中…</div>';
  try {
    const res = await fetch(API + encodeURIComponent('持仓.md'), { headers: ghHeaders(), cache: 'no-store' });
    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem(TOKEN_KEY);
      body.innerHTML = tokenSetupHTML('令牌无效或权限不足，请重新配置');
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    FILE_SHA = j.sha;
    PARSED = parseHoldings(b64d(j.content));
    renderEditor();
  } catch (e) {
    body.innerHTML = '<div class="empty">持仓加载失败：' + (e.message || '网络波动') + '<br>请稍后重试或重新配置令牌</div>';
  }
}
function tokenSetupHTML(msg) {
  const hasToken = !!getToken();
  return '<div class="token-box"><h3>配置 GitHub 令牌</h3>' +
    (msg ? '<p style="color:var(--warn);font-size:13px">' + msg + '</p>' : '') +
    (hasToken ? '<p style="font-size:12px;color:var(--ok)">已检测到令牌（仅存在本机浏览器）。如需更换或撤销，请粘贴新令牌覆盖或点击下方清除。</p>' : '') +
    '<ol><li>手机浏览器登录 GitHub，打开 Settings → Developer settings → <b>Fine-grained tokens</b> → Generate new token</li>' +
    '<li>Repository access 选 <b>Only select repositories</b> → 勾选 <b>stock-monitor-data</b></li>' +
    '<li>Permissions → Contents 设为 <b>Read and write</b>（其他一律不勾）</li>' +
    '<li>把令牌粘贴到下面（只存在本机浏览器，不会出现在公开页面代码里）</li></ol>' +
    '<input id="token-input" type="password" placeholder="粘贴 github_pat_ 开头的令牌">' +
    '<div style="display:flex;gap:8px"><button class="savebtn" style="flex:1" onclick="saveToken()">保存令牌并进入编辑</button>' +
    (hasToken ? '<button class="savebtn" style="flex:1;background:var(--warn);border-color:var(--warn)" onclick="clearToken()">清除令牌</button>' : '') +
    '</div><div class="status" id="token-status"></div></div>';
}
function saveToken() {
  const v = document.getElementById('token-input').value.trim();
  if (!v.startsWith('github_pat_') && !v.startsWith('ghp_')) {
    document.getElementById('token-status').textContent = '令牌格式不对，应以 github_pat_ 或 ghp_ 开头';
    document.getElementById('token-status').className = 'status err';
    return;
  }
  localStorage.setItem(TOKEN_KEY, v);
  initHoldings();
}
function clearToken() {
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById('holdings-body').innerHTML = tokenSetupHTML('已清除本机令牌');
}
function parseHoldings(md) {
  const lines = md.split('\n');
  const marks = ['## 一、', '## 二、', '## 三、', '## 四、', '## 五、'];
  const idx = marks.map(m => lines.findIndex(l => l.startsWith(m)));
  const pre = lines.slice(0, idx[0]).join('\n').trimEnd();
  const tail = lines.slice(idx[4]).join('\n');
  function grab(from, to) {
    const seg = lines.slice(from, to === undefined ? undefined : to);
    const title = seg[0];
    const notes = []; const rows = []; let header = null;
    for (const l of seg.slice(1)) {
      if (l.startsWith('>')) { notes.push(l); continue; }
      if (l.startsWith('|')) {
        const cells = l.split('|').slice(1, -1).map(c => c.trim());
        if (!header) header = cells;
        else if (!cells.every(c => /^-{2,}$/.test(c))) rows.push(cells);
      }
    }
    return { title, notes, header, rows };
  }
  return { pre, tail,
    s1: grab(idx[0], idx[1]), s2: grab(idx[1], idx[2]),
    s3: grab(idx[2], idx[3]), s4: grab(idx[3], idx[4]) };
}
function buildTable(sec) {
  const out = ['| ' + sec.header.join(' | ') + ' |',
               '|' + sec.header.map(() => '---').join('|') + '|'];
  sec.rows.forEach(r => out.push('| ' + r.join(' | ') + ' |'));
  return out.join('\n');
}
function buildMD() {
  const secTitle = (sec, base, suffix) => '## ' + base + '（' + sec.rows.length + ' 只' + (suffix || '') + '）';
  const s = PARSED;
  const part = (sec, base, suffix) => secTitle(sec, base, suffix) + '\n\n' +
    (sec.notes.length ? sec.notes.join('\n') + '\n\n' : '') + buildTable(sec);
  return s.pre + '\n\n' +
    part(s.s1, '一、A股持仓') + '\n\n' +
    part(s.s2, '二、A股自选', '，非持仓') + '\n\n' +
    part(s.s3, '三、港股持仓') + '\n\n' +
    part(s.s4, '四、港股自选', '，非持仓') + '\n\n' + s.tail + '\n';
}
function renderEditor() {
  const body = document.getElementById('holdings-body');
  body.innerHTML = '<div class="note">✏️ 点开分类修改各栏，改完点「保存」。<b>保存后下一轮扫描（工作日 10:45 / 14:20）即按新持仓分析</b>。监控流程只回写「上次信号状态」列，其余列以你保存的为准。</div>' +
    secEditor('s1') + secEditor('s2') + secEditor('s3') + secEditor('s4') +
    '<button class="savebtn" onclick="saveHoldings()">保存全部修改</button>' +
    '<div class="status" id="save-status"></div>';
}
function secEditor(key) {
  const label = { s1: 'A股持仓', s2: 'A股自选', s3: '港股持仓', s4: '港股自选' }[key];
  const sec = PARSED[key];
  const empty = sec.rows.length ? '' : '<div class="empty" style="padding:6px">暂无标的，点下方「添加一行」</div>';
  return '<div class="dgroup' + (key === 's1' ? ' open' : '') + '" id="grp-' + key + '">' +
    '<button class="drow" onclick="toggleGroup(\'' + key + '\')"><span class="arrow">▶</span>' +
    '<span class="date">' + label + '</span><span class="cnt" id="cnt-' + key + '">' + sec.rows.length + ' 只</span></button>' +
    '<div class="chips" id="body-' + key + '"><div class="chips-inner"><div id="list-' + key + '">' + empty +
    sec.rows.map((r, i) => rowCard(key, r, i, sec.header)).join('') +
    '</div><button class="addbtn" onclick="addRow(\'' + key + '\')">＋ 添加一行</button></div></div></div>';
}
function toggleGroup(key) {
  document.getElementById('grp-' + key).classList.toggle('open');
}
function rowCard(key, r, i, header) {
  let fields = '';
  header.forEach((h, ci) => {
    const ro = (ci === 0) ? ' readonly style="color:var(--muted)"' : '';
    fields += '<div' + (h.includes('监控') || h.includes('关注') || h.includes('备注') ? ' class="full"' : '') +
      '><label>' + h + '</label><input data-sec="' + key + '" data-row="' + i + '" data-col="' + ci + '" value="' +
      String(r[ci] || '').replace(/"/g, '&quot;') + '"' + ro + '></div>';
  });
  return '<div class="stock-card"><div class="head"><span class="name">' + (i + 1) + '. ' + (r[1] || '（未命名）') + '</span>' +
    '<button class="del" onclick="delRow(\'' + key + '\',' + i + ')">删除</button></div>' +
    '<div class="fields">' + fields + '</div></div>';
}
function syncInputs() {
  document.querySelectorAll('input[data-sec]').forEach(inp => {
    const sec = PARSED[inp.dataset.sec];
    const row = sec.rows[+inp.dataset.row];
    if (row) row[+inp.dataset.col] = inp.value;
  });
}
function addRow(key) {
  syncInputs();
  const sec = PARSED[key];
  sec.rows.push(sec.header.map(() => ''));
  renderList(key);
}
function delRow(key, i) {
  syncInputs();
  if (!confirm('确定删除这一行吗？')) return;
  PARSED[key].rows.splice(i, 1);
  renderList(key);
}
function renderList(key) {
  const sec = PARSED[key];
  sec.rows.forEach((r, i) => { r[0] = String(i + 1); });
  document.getElementById('cnt-' + key).textContent = sec.rows.length + ' 只';
  const empty = sec.rows.length ? '' : '<div class="empty" style="padding:6px">暂无标的，点下方「添加一行」</div>';
  document.getElementById('list-' + key).innerHTML = empty +
    sec.rows.map((r, i) => rowCard(key, r, i, sec.header)).join('');
}
function refresh(key) {
  syncInputs();
  renderList(key);
}
async function saveHoldings() {
  syncInputs();
  ['s1', 's2', 's3', 's4'].forEach(key => {
    PARSED[key].rows.forEach((r, i) => { r[0] = String(i + 1); });
  });
  const status = document.getElementById('save-status');
  status.textContent = '保存中…'; status.className = 'status';
  try {
    const md = buildMD();
    const res = await fetch(API + encodeURIComponent('持仓.md'), {
      method: 'PUT', headers: ghHeaders(),
      body: JSON.stringify({ message: '持仓更新（网页端 ' + new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false }) + '）',
        content: b64e(md), sha: FILE_SHA })
    });
    if (res.status === 409 || res.status === 422) {
      status.textContent = '远端已更新（可能扫描刚回写过状态），正在合并重试…';
      status.className = 'status';
      const j2 = await (await fetch(API + encodeURIComponent('持仓.md'), { headers: ghHeaders(), cache: 'no-store' })).json();
      FILE_SHA = j2.sha;
      const remote = parseHoldings(b64d(j2.content));
      ['s1', 's2', 's3', 's4'].forEach(k => {
        remote[k].rows.forEach(rr => {
          const mine = PARSED[k].rows.find(m => m[1] === rr[1]);
          if (mine) mine[PARSED[k].header.indexOf('上次信号状态')] = rr[PARSED[k].header.indexOf('上次信号状态')] || '';
        });
      });
      const res2 = await fetch(API + encodeURIComponent('持仓.md'), {
        method: 'PUT', headers: ghHeaders(),
        body: JSON.stringify({ message: '持仓更新（网页端，合并状态列后重试）', content: b64e(buildMD()), sha: FILE_SHA })
      });
      if (!res2.ok) throw new Error('HTTP ' + res2.status);
    } else if (!res.ok) {
      throw new Error('HTTP ' + res.status);
    }
    status.textContent = '✅ 已保存。下一轮扫描（工作日 10:45 / 14:20）自动按新持仓分析；也可在对话里让我立即重扫。';
    status.className = 'status ok';
  } catch (e) {
    status.textContent = '保存失败：' + (e.message || '网络波动') + '，请重试';
    status.className = 'status err';
  }
}
</script>
