<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#185fa5">
<title>每日新闻简报</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1f2328; --muted: #656d76;
    --border: #d8dee4; --accent: #185fa5; --accent-soft: #e6f1fb;
    --hi-bg: #faeeda; --hi-tx: #854f0b; --ok: #1d7a3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 15px; line-height: 1.7; }
  header { background: var(--card); border-bottom: 1px solid var(--border);
    padding: 12px 16px 0; position: sticky; top: 0; z-index: 10; }
  .row { max-width: 880px; margin: 0 auto; display: flex; align-items: baseline; gap: 8px; }
  h1 { font-size: 17px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .navlink { color: var(--accent); font-size: 13px; text-decoration: none; white-space: nowrap; }
  .dates { max-width: 880px; margin: 0 auto; display: flex; gap: 6px; overflow-x: auto;
    padding: 9px 0 10px; scrollbar-width: none; }
  .dates::-webkit-scrollbar { display: none; }
  .dchip { flex: 0 0 auto; border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
    transition: background .15s ease, border-color .15s ease, color .15s ease; }
  .dchip.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 999px; }
  .dchip:focus-visible { outline-color: var(--accent); }
  .wrap { max-width: 880px; margin: 14px auto 30px; padding: 0 12px; }
  .daybar { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 12px; }
  .daybar .date { font-size: 16px; font-weight: 600; }
  .daybar .edition { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .daybar details { margin-top: 8px; }
  .daybar summary { font-size: 12px; color: var(--muted); cursor: pointer; }
  .daybar .srcline { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px; }
  .card-top { display: flex; gap: 10px; align-items: flex-start; }
  .idx { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); font-size: 12px; font-weight: 600; display: flex; align-items: center;
    justify-content: center; margin-top: 3px; }
  .card h3 { font-size: 16px; font-weight: 600; line-height: 1.5; }
  .summary { font-size: 14.5px; color: var(--text); margin-top: 10px; }
  .hi { background: var(--hi-bg); border-radius: 8px; padding: 9px 12px; margin-top: 10px; font-size: 13.5px; color: var(--hi-tx); }
  .hi b { font-weight: 600; }
  .meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--muted); }
  .meta a { color: var(--accent); text-decoration: none; }
  .empty { color: var(--muted); text-align: center; padding: 60px 16px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 16px 30px; }
  @media (min-width: 600px) { h1 { font-size: 19px; } .card { padding: 18px 22px; } }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>每日新闻简报</h1>
    <a class="navlink" href="reports.html">报告页 →</a>
    <div class="sub" id="updated"></div>
  </div>
  <div class="dates" id="dates"><span class="dchip">加载中…</span></div>
</header>
<div class="wrap">
  <div id="daybar"></div>
  <div id="list"><div class="empty">正在载入最新简报…</div></div>
</div>
<footer>
  简报内容由 AI 基于公开信息整理，仅供研究参考，不构成投资建议。投资有风险，决策需谨慎。
</footer>
<script>
const GH_BASE = 'https://ericheee111.github.io/stock-monitor-reports/';
const MIRROR = 'https://cdn.jsdelivr.net/gh/ericheee111/stock-monitor-reports@main/';
const SOURCES = ['', MIRROR];
const delay = ms => new Promise(r => setTimeout(r, ms));
const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

async function fetchText(path) {
  let lastErr = null;
  for (let s = 0; s < SOURCES.length; s++) {
    for (let t = 0; t < 2; t++) {
      try {
        const url = (SOURCES[s] || GH_BASE) + path + '?t=' + Date.now();
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return { text: await res.text(), via: s };
      } catch (e) { lastErr = e; await delay(500); }
    }
  }
  throw lastErr || new Error('all sources failed');
}

let DATES = [];
let CURRENT = '';

function loadIndex() {
  fetchText('news/index.json')
    .then(({ text }) => {
      const d = JSON.parse(text);
      DATES = d.dates || [];
      document.getElementById('updated').textContent = d.generatedAt ? ('更新于 ' + d.generatedAt) : '';
      renderDates();
      if (DATES.length) select(DATES[0].date);
      else document.getElementById('list').innerHTML = '<div class="empty">暂未发布简报</div>';
    })
    .catch(() => {
      document.getElementById('dates').innerHTML = '<span class="dchip">加载失败</span>';
      document.getElementById('list').innerHTML =
        '<div class="empty">简报索引加载失败（网络波动）<br><br>' +
        '<a style="color:var(--accent)" href="' + GH_BASE + 'news/index.json" target="_blank">直接打开索引文件</a><br>' +
        '<span style="font-size:12px">刷新页面可重试</span></div>';
    });
}

function renderDates() {
  const box = document.getElementById('dates');
  box.innerHTML = '';
  DATES.forEach((d, i) => {
    const b = document.createElement('button');
    b.className = 'dchip' + (i === 0 ? ' active' : '');
    b.dataset.date = d.date;
    const wd = WEEK[new Date(d.date + 'T00:00:00').getDay()];
    b.textContent = d.date.slice(5) + ' ' + wd + (i === 0 ? ' · 最新' : '');
    b.onclick = () => select(d.date);
    box.appendChild(b);
  });
}

async function select(date) {
  CURRENT = date;
  document.querySelectorAll('.dchip').forEach(c => c.classList.toggle('active', c.dataset.date === date));
  const chip = document.querySelector('.dchip.active');
  if (chip) chip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  const bar = document.getElementById('daybar');
  const list = document.getElementById('list');
  bar.innerHTML = '';
  list.innerHTML = '<div class="empty">加载中…</div>';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  try {
    const { text, via } = await fetchText('news/' + date + '.json');
    if (CURRENT !== date) return;
    const d = JSON.parse(text);
    bar.innerHTML = '<div class="daybar"><div class="date">' + d.date +
      ' <span style="font-size:13px;color:var(--muted);font-weight:400">' + (d.edition || '') + '</span></div>' +
      '<div class="edition">共 ' + d.items.length + ' 条 · 生成于 ' + (d.publishedAt || '—') + '</div>' +
      (d.sourceNote ? '<details><summary>信息来源说明</summary><div class="srcline">' + d.sourceNote + '</div></details>' : '') +
      '</div>';
    list.innerHTML = d.items.map((it, i) => card(it, i)).join('') +
      (via > 0 ? '<div class="empty" style="padding:12px;font-size:12px">（主源暂时不可达，本条经备用镜像提供）</div>' : '');
  } catch (e) {
    if (CURRENT !== date) return;
    list.innerHTML = '<div class="empty">该日简报加载失败（网络波动），可稍后重试<br><br>' +
      '<a style="color:var(--accent)" href="' + GH_BASE + 'news/' + date + '.json" target="_blank">打开原始数据</a></div>';
  }
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function card(it, i) {
  const q = encodeURIComponent(it.title);
  const link = it.url
    ? '<a href="' + esc(it.url) + '" target="_blank">原文链接</a>'
    : '<a href="https://www.bing.com/search?q=' + q + '" target="_blank">搜索相关</a>';
  return '<article class="card">' +
    '<div class="card-top"><span class="idx">' + (i + 1) + '</span><h3>' + esc(it.title) + '</h3></div>' +
    (it.summary ? '<p class="summary">' + esc(it.summary) + '</p>' : '') +
    (it.highlight ? '<div class="hi"><b>关注点 · </b>' + esc(it.highlight) + '</div>' : '') +
    '<div class="meta">' +
      (it.publishedAt ? '<span>发布 ' + esc(it.publishedAt) + '</span>' : '') +
      (it.timeHint ? '<span>事件时间 ' + esc(it.timeHint) + '</span>' : '') +
      (it.source ? '<span>来源：' + esc(it.source) + '</span>' : '') +
      link +
    '</div></article>';
}

loadIndex();
</script>
</body>
</html>
